version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    networks:
      - codeigniter_network
    depends_on:
      - db
    ports:
      - "8080:80"

  db:
    image: mariadb:11.2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: codeigniter
      MYSQL_USER: ci_user
      MYSQL_PASSWORD: ci_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - codeigniter_network
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: ci_user
      PMA_PASSWORD: ci_password
    ports:
      - "8081:80"
    networks:
      - codeigniter_network
    depends_on:
      - db

networks:
  codeigniter_network:
    driver: bridge

volumes:
  mariadb_data: